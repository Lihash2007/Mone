name: Build iOS (mone)

on:
  push:
    branches: [ main ]
    paths:
      - 'ios/**'
      - '.github/workflows/ios_build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'ios/**'
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Target to build'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'ipa (Physical iPhone / Sideloading)'
          - 'simulator (Xcode Simulator .app)'

jobs:
  build-ios:
    name: Build iOS (Target 17.0+)
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Environment & Precache iOS
        run: |
          flutter --version
          xcodebuild -version
          flutter precache --ios

      - name: Install Dependencies
        working-directory: ./ios
        run: |
          flutter pub get

      - name: Build iOS Simulator (.app)
        if: ${{ github.event.inputs.build_target == 'both' || github.event.inputs.build_target == 'simulator (Xcode Simulator .app)' || github.event_name == 'push' || github.event_name == 'pull_request' }}
        working-directory: ./ios
        run: |
          echo "Building iOS Simulator (no codesign)..."
          set +e
          flutter build ios --simulator --no-codesign -v 2>&1 | tee build_simulator.log
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "### ❌ iOS Simulator Build Failed (Exit Code: $BUILD_STATUS)" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            grep -C 3 -E "(error:|fatal error:)" build_simulator.log | tail -n 60 >> $GITHUB_STEP_SUMMARY || tail -n 60 build_simulator.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $BUILD_STATUS
          fi
          
          echo "Zipping Simulator App bundle..."
          cd build/ios/iphonesimulator
          zip -r ../../../mone-simulator.zip Runner.app
          cd ../../..
          echo "Created mone-simulator.zip successfully!"

      - name: Build iOS Release (Unsigned .app & .ipa)
        if: ${{ always() && (github.event.inputs.build_target == 'both' || github.event.inputs.build_target == 'ipa (Physical iPhone / Sideloading)' || github.event_name == 'push' || github.event_name == 'pull_request') }}
        working-directory: ./ios
        run: |
          echo "Building iOS Release (no codesign)..."
          set +e
          flutter build ios --release --no-codesign -v 2>&1 | tee build_release.log
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "### ❌ iOS Release Build Failed (Exit Code: $BUILD_STATUS)" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            grep -C 3 -E "(error:|fatal error:)" build_release.log | tail -n 60 >> $GITHUB_STEP_SUMMARY || tail -n 60 build_release.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $BUILD_STATUS
          fi
          
          echo "Packaging into unsigned IPA..."
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r mone-release-unsigned.ipa Payload
          echo "Created mone-release-unsigned.ipa successfully!"

      - name: Print Diagnostic Logs on Failure
        if: ${{ failure() }}
        working-directory: ./ios
        run: |
          echo "========================================="
          echo "=== iOS BUILD ERROR DIAGNOSTIC SUMMARY ==="
          echo "========================================="
          if [ -f build_simulator.log ]; then
            echo ">>> Errors from build_simulator.log:"
            grep -C 3 -E "(error:|fatal error:)" build_simulator.log || tail -n 100 build_simulator.log
          fi
          if [ -f build_release.log ]; then
            echo ">>> Errors from build_release.log:"
            grep -C 3 -E "(error:|fatal error:)" build_release.log || tail -n 100 build_release.log
          fi

      - name: Upload Unsigned IPA
        if: ${{ always() && (github.event.inputs.build_target == 'both' || github.event.inputs.build_target == 'ipa (Physical iPhone / Sideloading)' || github.event_name == 'push' || github.event_name == 'pull_request') }}
        uses: actions/upload-artifact@v4
        with:
          name: mone-ios-release-unsigned-ipa
          path: ./ios/mone-release-unsigned.ipa
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Simulator App
        if: ${{ always() && (github.event.inputs.build_target == 'both' || github.event.inputs.build_target == 'simulator (Xcode Simulator .app)' || github.event_name == 'push' || github.event_name == 'pull_request') }}
        uses: actions/upload-artifact@v4
        with:
          name: mone-ios-simulator-app
          path: ./ios/mone-simulator.zip
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Build Logs on Failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-diagnostic-logs
          path: |
            ./ios/build_simulator.log
            ./ios/build_release.log
          if-no-files-found: ignore
          retention-days: 7
